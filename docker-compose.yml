services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      SITE_MOTTO: ${SITE_MOTTO:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-5}
      MAX_IMAGES: ${MAX_IMAGES:-6}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - data:/data
    ports:
      # Служебный API (создание админов). Доступен только с самого сервера.
      - "127.0.0.1:${INTERNAL_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/gazeta", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
